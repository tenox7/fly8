# flymac.ini (for macOS/SDL2, read instead of fly.ini by the mac build)
#
# This is part of the flight simulator 'fly8'.
# Author: Eyal Lebedinsky (eyal@eyal.emu.id.au).
#
# Explanations in fly8.doc, more examples in the unix fly.ini.

# Name to identify myself, team and home:
#
	NPilot		My prefered name
	Tone		My team name
	Ha18		My home runway

# Set HUD color
#
	ch0x60c060	hud: light green (brighter)

# we have ample memory:
#
	nb20000		allow larger display list

# SDL2 video driver. Options: single, hidpi, full, novsync, stats
# Window sizes are in grsdl.vmd: ms mm ml mxl m1024x768 m720p m1080p...
#
	dvgrsdl
	Vgrsdl
	ml

# Pointing device: the mouse, the keypad, or an SDL joystick/gamepad.
# Joystick options: rdr ttl ttl- hat js=N play=N, axes via sx= sy= sr= st=
#
	dpmouse:smx=3:smy=3:d=0
#	dpkeypad:linear
#	dpsdlstick:d=0				basic stick, 2 axes
#	dpsdlstick:rdr:ttl-:hat:d=046		HOTAS: rudder, throttle, hat
#	dpsdlstick:rdr:sr=3:ttl:st=6:d=0	gamepad: right stick X rudder, RT throttle

# Sound driver: SDL2 beeper (volume=0-100)
#
	dsplsdl:volume=50

# Networking (needs fly8udp running):
#
#	r
#	dnudp.1:pack=1408

# Select main and drone type:
#
#	Pplane:classic
#	Pplane:basic
#	Pplane:f16
